name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Statik kalite + birim testler + derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Biçim kontrolü (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Tür kontrolü (TypeScript)
        run: pnpm typecheck

      - name: Birim testler (Vitest)
        run: pnpm test

      - name: Üretim derlemesi (Turborepo)
        run: pnpm build

      - name: Prisma şema doğrulama
        run: pnpm db:validate

  integration:
    name: Entegrasyon + health uçları + E2E (gerçek servislerle)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: teknikflow
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: teknikflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teknikflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rustfs:
        # S3-uyumlu obje deposu (MinIO OSS Nisan 2026'da arşivlendi — ADR-0005)
        image: rustfs/rustfs:1.0.4
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: local_s3_user
          RUSTFS_SECRET_KEY: local_s3_password_change_me

    env:
      # Faz 03: iki rollerli erişim — uygulama NOSUPERUSER (RLS tabi),
      # migration bootstrap sahibiyle. CI'de gizli değerler olmayan yerel
      # kimliklerdir; AUTH_JWT_SECRET yalnız test amaçlı sabittir.
      DATABASE_URL: postgresql://teknikflow_app:local_dev_only@localhost:5432/teknikflow
      MIGRATION_DATABASE_URL: postgresql://teknikflow:local_dev_only@localhost:5432/teknikflow
      TEST_DATABASE_URL: postgresql://teknikflow_app:local_dev_only@localhost:5432/teknikflow
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: teknikflow-private
      S3_ACCESS_KEY: local_s3_user
      S3_SECRET_KEY: local_s3_password_change_me
      API_BASE_URL: http://localhost:4000
      AUTH_JWT_SECRET: ci_only_secret_value_min_32_characters_padding
      AUTH_SESSION_TTL_HOURS: 12
      AUTH_ACCESS_TOKEN_TTL_SECONDS: 900
      AUTH_REFRESH_TOKEN_TTL_DAYS: 30
      AUTH_INVITE_TTL_HOURS: 72
      AUTH_RATE_LIMIT_WINDOW_SECONDS: 300
      AUTH_RATE_LIMIT_MAX: 10
      DEMO_SEED_PASSWORD: Atlas!2026

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Veritabanı migration'ları uygula
        run: pnpm db:migrate

      - name: Uygulama rolünü kur (NOSUPERUSER — RLS için)
        run: pnpm db:setup-role

      - name: Tohum (bucket + RBAC kataloğu + planlar + demo kiracı)
        run: pnpm db:seed

      - name: Entegrasyon testleri (health uçları — gerçek DB/Redis/RustFS)
        run: pnpm test:integration

      - name: Storybook derlemesi (tüm hikâyeler)
        run: pnpm --filter @teknikflow/ui-web storybook:build

      - name: Storybook etkileşim testleri (vitest + play fonksiyonları)
        run: pnpm --filter @teknikflow/ui-web test:storybook

      - name: Playwright tarayıcısını kur
        run: pnpm --filter @teknikflow/web exec playwright install --with-deps chromium

      - name: API'yi başlat
        run: |
          pnpm --filter @teknikflow/api dev > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:4000/health/live

      - name: Worker'ı başlat
        run: |
          pnpm --filter @teknikflow/worker dev > worker.log 2>&1 &
          echo $! > worker.pid
          # İlk kalp atışı yazılana kadar bekle (en fazla ~40 sn).
          for i in $(seq 1 40); do
            if curl -sf http://localhost:4001/health > /dev/null; then
              echo "worker sağlıklı"; exit 0
            fi
            sleep 1
          done
          echo "worker hazır değil; son yanıt:"; curl -s http://localhost:4001/health || true
          exit 1

      - name: Web E2E (Chromium — kimlik akışları, rol sınırı, kabuk, durum sayfası)
        run: pnpm --filter @teknikflow/web test:e2e

      - name: Health uçlarını doğrula (curl kanıtı)
        run: |
          echo "=== /health/live ==="
          curl -s http://localhost:4000/health/live
          echo
          echo "=== /health/ready ==="
          curl -s http://localhost:4000/health/ready

      - name: Logları yükle (hata ayıklama)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            api.log
            worker.log
            apps/web/playwright-report/
          if-no-files-found: ignore
